name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - name: Check tag matches plugin version
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          with open("plugins/ae-keremkit/.claude-plugin/plugin.json", encoding="utf-8") as f:
              version = json.load(f)["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              sys.exit(f"tag {tag} does not match plugin.json version {version} (expected v{version})")
          PY
      - run: python -m pytest -q
      - run: python tools/build_skill.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
